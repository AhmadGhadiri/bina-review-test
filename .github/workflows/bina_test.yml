name: Test Bina Review

on: [push, pull_request]

jobs:
  bina-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Bina Static Analysis
        uses: AhmadGhadiri/bina-review@main
        with:
          path: .
          fail_on_high: false # Set to false so we can see all errors without failing the build immediately
